<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Gauge Ring Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" stroke-dasharray="753.98" stroke-dashoffset="188.5" transform="rotate(135 256 256)" />
  
  <!-- Gauge Ring Active Arc (Emerald Green) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="753.98" stroke-dashoffset="360" transform="rotate(135 256 256)" filter="url(#glow)" />
  
  <!-- Center Coin / Currency Symbol R$ -->
  <circle cx="256" cy="256" r="92" fill="#090a0f" stroke="#334155" stroke-width="4" />
  
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#10b981" text-anchor="middle" letter-spacing="-2">R$</text>
  
  <!-- Indicator Dot -->
  <circle cx="369" cy="143" r="14" fill="#34d399" filter="url(#glow)" />
</svg>
